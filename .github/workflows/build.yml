name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app and dmg
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/make-app.sh

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer-dmg
          path: build/ImageViewer.dmg
          if-no-files-found: error
